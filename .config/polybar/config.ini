[global/wm]
include-file = $HOME/.config/polybar/mocha.ini

[colors]
background = ${colors.base}
background-alt = ${colors.crust}
foreground = ${colors.text}
primary = ${colors.peach}
secondary = ${colors.yellow}
alert = ${colors.red}
disabled = ${colors.surface2}

[bar/mybar]
width = 100%
height = 32pt
bottom = true

dpi = 0

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

border-left = 8px

module-margin = 1

separator = |
separator-foreground = ${colors.disabled}

font-0 = NotoMono Nerd Font Mono:size=14
font-1 = NotoMono Nerd Font Mono:size=16
font-2 = NotoMono Nerd Font Mono:size=18

modules-left = xworkspaces xwindow
modules-center = date
modules-right = pulseaudio xkeyboard memory cpu wlan eth battery power

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

; tray-position = right

; wm-restack = generic
; wm-restack = bspwm
; wm-restack = i3

; override-redirect = true

[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-background = ${colors.background}
label-active-underline= ${colors.primary}
label-active-padding = 1

label-occupied = %name%
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%

[module/pulseaudio]
type = internal/pulseaudio

format-volume = <ramp-volume> <label-volume>
label-volume = %percentage:2%%
ramp-volume-foreground = ${colors.primary}
ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾

format-muted-prefix = "󰸈 "
format-muted-prefix-foreground = ${colors.primary}
label-muted = muted
label-muted-foreground = ${colors.disabled}

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock

label-layout = %layout%
label-layout-foreground = ${colors.primary}

label-indicator-padding = 2
label-indicator-margin = 1
label-indicator-foreground = ${colors.background}
label-indicator-background = ${colors.secondary}

[module/memory]
type = internal/memory
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.primary}
format-prefix-font = 3
label = %percentage_used:2%%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.primary}
format-prefix-font = 3
label = %percentage:2%%

[module/wlan]
type = internal/network
interval = 5
interface-type = wireless

format-connected = <ramp-signal> <label-connected>
label-connected = %essid% (%local_ip%)
ramp-signal-0 = 󰤯
ramp-signal-1 = 󰤟
ramp-signal-2 = 󰤢
ramp-signal-3 = 󰤥
ramp-signal-4 = 󰤨
ramp-signal-foreground = ${colors.primary}
ramp-signal-font = 3

format-disconnected-prefix = "󰤮 "
format-disconnected-prefix-foreground = ${colors.primary}
format-disconnected-prefix-font = 3
format-disconnected = <label-disconnected>
label-disconnected = disconnected
label-disconnected-foreground = ${colors.disabled}

format-packetloss-prefix = "󰤠 "
format-packetloss-prefix-foreground = ${colors.red}
format-packetloss-prefix-font = 3
format-packetloss = <label-packetloss>
label-packetloss = %essid% (%local_ip%)

[module/eth]
type = internal/network
interval = 5
interface-type = wired

format-connected-prefix = " "
format-connected-prefix-foreground = ${colors.primary} 
format-connected-prefix-font = 2
format-connected = <label-connected>
label-connected = %local_ip%

format-disconnected-prefix = "󰈀 "
format-disconnected-prefix-foreground = ${colors.primary} 
format-disconnected-prefix-font = 2
format-disconnected = <label-disconnected>
label-disconnected = disconnected
label-disconnected-foreground = ${colors.disabled}

format-packetloss-prefix = " "
format-packetloss-prefix-foreground = ${colors.red}
format-packetloss-prefix-font = 2
format-packetloss = <label-packetloss>
label-packetloss = %local_ip%

[module/date]
type = internal/date
interval = 1

date = %a, %d %b %Y %H:%M

label = %date%
label-foreground = ${colors.foreground}

[module/battery]
type = internal/battery

battery = BAT0
adapter = ACAD

time-format = %H:%M

low-at = 20

format-low-prefix = "󰂃 "
format-low-prefix-foreground = ${colors.red}
format-low-prefix-font = 2
format-low = <label-low>
label-low = %percentage%% %time%

format-charging-prefix = "󰂄 "
format-charging-prefix-foreground = ${colors.green}
format-charging-prefix-font = 2
format-charging = <label-charging>
label-charging = %percentage%% %time%

format-discharging = <ramp-capacity> <label-discharging>
ramp-capacity-0 = 󰂎
ramp-capacity-1 = 󰁺
ramp-capacity-2 = 󰁻 
ramp-capacity-3 = 󰁼
ramp-capacity-4 = 󰁽
ramp-capacity-5 = 󰁾
ramp-capacity-6 = 󰁿
ramp-capacity-7 = 󰂀
ramp-capacity-8 = 󰂁
ramp-capacity-9 = 󰂂
ramp-capacity-10 = 󰁹
ramp-capacity-foreground = ${colors.primary}
ramp-capacity-font = 2
label-discharging = %percentage%% %time%

format-full-prefix = "󰁹 "
format-full-prefix-foreground = ${colors.primary}
format-full-prefix-font = 2
format-full = <label-full>
label-full = %percentage%%

[module/power]
type = custom/text

click-left = $HOME/.config/rofi/utilities/power_menu/power_menu.sh
content = "󰐥  "
content-foreground = ${colors.primary}
content-font = 3

[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini
